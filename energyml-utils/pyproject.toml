[build-system]
requires = ["poetry-core>=1.0.0", "poetry-dynamic-versioning"]
build-backend = "poetry_dynamic_versioning.backend"
# requires = ["setuptools"]
# build-backend = "setuptools.build_meta"

[tool.poetry]
name = "energyml-utils"
version = "0.0.0" # Set at build time
description = "Energyml helper"
authors = [
    "Valentin Gauthier <valentin.gauthier@geosiris.com>"
]
maintainers = [
    "Valentin Gauthier <valentin.gauthier@geosiris.com>"
]
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/geosiris-technologies/energyml-python"
homepage = "http://www.geosiris.com"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python",
    "Topic :: Internet",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development",
]
keywords = ["energyml", "resqml", "witsml", "prodml"]
packages = [
    { include = "energyml", from = "src" },
]
include = [
    "src/energyml/utils/rc/*.xml",
    "src/energyml/utils/rc/*.json"
]
#exclude = [
#    "src/energyml/main.py"
#]

[tool.pytest.ini_options]
pythonpath = [ "src" ]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
addopts = "-m 'not slow'"
testpaths = [ "tests" ]
python_files = [ "test_*.py", "*_test.py" ]
python_classes = [ "Test*" ]
python_functions = [ "test_*" ]

[tool.poetry.extras]
# A dependency listed here is made *optional* by poetry, whatever `optional = false` says below.
# `numpy` and `h5py` used to be listed in `parquet` / `hdf5`, so the published wheel declared them
# as `; extra == "parquet"` / `; extra == "hdf5"` — a plain `pip install energyml-utils` installed
# neither, and `import energyml.utils.epc` then died on `ModuleNotFoundError: No module named
# 'numpy'`. They are hard dependencies (numpy is imported at module level, HDF5 is the default
# external-array format of EnergyML) and are therefore declared only in `dependencies` now.
parquet = ["pyarrow", "pandas"]
las = ["lasio"]
segy = ["segyio"]
geometry = ["scipy"]
crs = ["pyproj"]

[tool.poetry.dependencies]
python = "^3.9"
xsdata = {version = "^24.0", extras = ["cli", "lxml"]}
energyml-opc = "^1.12.0"
h5py = { version = "^3.11.0", optional = false }
# `^1.16.6` meant `<2.0.0`. NumPy 2 is the default in most new environments, and consumers ended
# up on it anyway — where `np.array(x, copy=False)` changed meaning and made every HDF5 array
# silently unreadable (see datasets_io.read_array_view). The spelling is fixed and the suite runs
# on 1.26 and 2.3 alike, so the ceiling is now the next major.
numpy = { version = ">=1.16.6,<3.0.0", optional = false }
scipy = { version = ">=1.7", optional = true }
pyarrow = { version = "^14.0.1", optional = true }
pandas = { version = "^1.1.0", optional = true }
lasio = { version = "^0.31", optional = true }
segyio = { version = "^1.9", optional = true }
# CRS reprojection (WGS84). pyproj >=3.7 requires python >=3.10, so keep a loose constraint
# and let the resolver pick 3.6.x on python 3.9.
pyproj = { version = ">=3.4", optional = true }

[tool.poetry.group.dev.dependencies]
coverage = {extras = ["toml"], version = "^6.2"}
pytest = "^8.1.1"
pytest-cov = "^4.1.0"
flake8 = "^7.3.0"
black = "^22.3.0"
pylint = "^2.7.2"
click = ">=8.1.3, <=8.1.3" # upper version than 8.0.2 fail with black
pdoc3 = "^0.10.0"
snakeviz = "^2.1.0" # code perf tests
pydantic = { version =  "^2.0"}
energyml-common2-0 = "^1.12.0"
energyml-common2-1 = "^1.12.0"
energyml-common2-2 = "^1.12.0"
energyml-common2-3 = "^1.12.0"
energyml-resqml2-0-1 = "^1.12.0"
energyml-resqml2-2-dev3 = "^1.12.0"
energyml-resqml2-2 = "^1.12.0"
energyml-witsml2-0 = "^1.12.0"
energyml-witsml2-1 = "^1.12.0"
energyml-prodml2-0 = "^1.12.0"
energyml-prodml2-2 = "^1.12.0"

mypy = "^0.971"
bandit = "^1.7.0"
safety = "^1.10.0"
memory-profiler = "^0.60.0"
# line-profiler = "^4.0.0"

[tool.coverage.run]
branch = true
source = ["src/energyml"]

[tool.black]
line-length = 120
target-version = ["py39"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.pytest_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | htmlcov
)/
'''

[tool.pylint.format]
max-line-length = "120"

[tool.poetry-dynamic-versioning]
enable = true
vcs = "git"
style = "pep440"
format-jinja = """
    {%- if distance == 0 -%}
        {{ serialize_pep440(base, stage, revision) }}
    {%- elif revision is not none -%}
        {{ serialize_pep440(base, stage, revision + 1, dev=distance,
            ) }}
    {%- else -%}
        {{ serialize_pep440(bump_version(base), stage, revision, dev=distance,
            ) }}
    {%- endif -%}
"""

[tool.poetry.scripts]
extract_3d = "energyml.utils.cli:extract_representation_in_3d_file"
csv_to_dataset = "energyml.utils.cli:csv_to_dataset"
generate_data = "energyml.utils.cli:generate_data"
generate_multiple_data = "energyml.utils.cli:generate_multiple_data"
xml_to_json = "energyml.utils.cli:xml_to_json"
json_to_xml = "energyml.utils.cli:json_to_xml"
json_to_epc = "energyml.utils.cli:json_to_epc"
loadNsave = "energyml.utils.cli:load_n_save"
describe_as_csv = "energyml.utils.cli:describe_as_csv"
validate = "energyml.utils.cli:validate_files"
