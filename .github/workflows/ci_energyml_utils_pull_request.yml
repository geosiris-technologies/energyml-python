---
name: Test/Build/Publish (pypiTest)

defaults:
  run:
    working-directory: energyml-utils

on:
  push:
    branches:
      - main
  pull_request:
  release:
    types: [published]

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install poetry
        uses: ./.github/actions/prepare-poetry
        with:
          python-version: "3.10"

      - name: Install dependencies (all extras)
        run: |
          poetry install --all-extras

      - name: Check the published test fixtures are present
        # tests/ runs against real EPCs rather than mock dataclasses, and rc/**/*.epc is
        # git-ignored with a per-file allow list. Only the FESAPI testing packages are cleared
        # for publication; the field-data EPCs stay local and their tests skip here. Dropping
        # one of these from the allow list would silently turn its tests into skips, so fail
        # loudly instead.
        run: |
          missing=0
          for f in rc/epc/testingPackageCpp.epc rc/epc/testingPackageCpp.h5 \
                   rc/epc/testingPackageCpp22.epc rc/epc/testingPackageCpp22.h5; do
            if [ ! -f "$f" ]; then echo "::error::missing test fixture $f"; missing=1; fi
          done
          exit $missing

      - name: Run pytest (whole suite, slow tests included)
        # pyproject.toml sets `addopts = "-m 'not slow'"` so a local run stays quick; `-m ""`
        # clears that filter. Without it CI silently skips the tests that compare EpcFile with
        # EpcStreamReader over the large packages.
        run: |
          poetry run pytest -v --tb=short -m "" --durations=15

  build:
    name: Build distribution
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install poetry
        uses: ./.github/actions/prepare-poetry
        with:
          python-version: "3.10"

      - name: Build
        run: |
          poetry build

      - name: Display folder
        shell: bash
        if: always()
        run: |
          echo "::debug::listing folder"
          ls -R
          echo `ls -R`
          echo "GITHUB_WORKSPACE ${{ github.workspace }}"
          echo `ls GITHUB_WORKSPACE ${{ github.workspace }}`

      - name: Save build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Build-Artifact
          if-no-files-found: error
          path: ${{ github.workspace }}/energyml-utils/dist

  publish:
    name: Publish to PyPI
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      # Retrieve the code and GIT history so that poetry-dynamic-versioning knows which version to upload
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get build artifacts
        uses: actions/download-artifact@v4
        with:
          name: Build-Artifact
          path: ${{ github.workspace }}/energyml-utils/dist

      - name: Install poetry
        uses: ./.github/actions/prepare-poetry
        with:
          python-version: "3.10"

      - name: Upload to PyPI TEST
        run: |
          poetry config repositories.test-pypi https://test.pypi.org/legacy/
          poetry config pypi-token.test-pypi ${{ secrets.POETRY_PYPI_TEST_TOKEN_VALUE }}
          poetry publish --repository test-pypi
